<!doctype html>
<html lang="gl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fol e ar</title>
  <meta name="description" content="Atlas textual, musical e editorial de coplas galegas.">
  <link rel="icon" href="./assets/marca/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/marca/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/marca/apple-touch-icon.png">
  <meta name="theme-color" content="#F7F7F2">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <script>
    window.FOL_E_AR_FILE_MODE = location.protocol === "file:";
    if (window.FOL_E_AR_FILE_MODE) {
      const localUrl = `http://localhost:8765/frontend/index.html${location.search}${location.hash}`;
      fetch(localUrl, { mode: "no-cors" })
        .then(() => location.replace(localUrl))
        .catch(() => {
          window.addEventListener("DOMContentLoaded", () => {
            document.body.innerHTML = `
              <main class="file-mode-notice">
                <section>
                  <h1>Fol e ar precisa o servidor local</h1>
                  <p>Abre a app desde localhost para poder cargar JSON, GeoJSON e módulos JavaScript.</p>
                  <code>./serve.sh 8765</code>
                  <a href="${localUrl}">Abrir localhost</a>
                </section>
              </main>
            `;
          });
        });
    }
  </script>
</head>
<body class="fol-shell">
  <div id="global-loading" class="global-loading" role="status" aria-live="polite">
    <svg class="global-loading-mark fol-loader-mark isotipo" viewBox="8 9 48 50" aria-hidden="true" focusable="false"><path pathLength="100" d="M50.79 27.16A20 20 0 1 1 38.84 15.21"/><circle cx="51.1" cy="14.9" r="4.2"/></svg>
    <p>Cargando o arquivo…</p>
  </div>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <a class="brand" href="./index.html" aria-label="Fol e ar, inicio">
        <svg class="brand-iso isotipo" viewBox="8 9 48 50" aria-hidden="true" focusable="false"><path d="M50.79 27.16A20 20 0 1 1 38.84 15.21"/><circle cx="51.1" cy="14.9" r="4.2"/></svg>
        <span class="brandtext">
          <strong class="brandtitle wordmark">f<svg class="wordmark-o" viewBox="0 0 60 54" aria-hidden="true" focusable="false"><path d="M49.56 21.27A20.45 20.45 0 1 1 35.98 7.69"/><circle cx="49.52" cy="7.73" r="7.4"/></svg>l e ar</strong>
          <small class="brandsub">arquivo e repertorio</small>
        </span>
      </a>

      <nav class="nav">
        <button class="active" type="button" data-view="map"><span class="nav-icon">⌖</span><span class="nav-label">Mapa</span></button>
        <button type="button" data-view="territory"><span class="nav-icon">⌂</span><span class="nav-label">Territorios</span></button>
        <button type="button" data-view="coplas"><span class="nav-icon">≋</span><span class="nav-label">Coplas</span></button>
        <button type="button" data-view="melodies"><span class="nav-icon">♫</span><span class="nav-label">Melodías</span></button>
        <button type="button" data-view="pieces"><span class="nav-icon">♪</span><span class="nav-label">Pezas <b class="cart-count" data-cart-count hidden>0</b></span></button>
        <button type="button" data-view="media"><span class="nav-icon">◧</span><span class="nav-label">Media</span></button>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot">
        <button id="collapseBtn" type="button"><span class="nav-icon">‹</span><span>Contraer</span></button>
        <button type="button" data-view="about"><span class="nav-icon">i</span><span>Sobre o arquivo</span></button>
      </div>
    </aside>

    <main class="main">
      <section class="view active" id="view-map" aria-label="Mapa">
        <div class="map-wrap"><div id="map"></div></div>
        <div class="floating-search">
          <span class="search-glyph">⌕</span>
          <input id="mapSearch" type="search" placeholder="Buscar territorio, copla ou etiqueta">
          <select id="mapLayer" aria-label="Capa territorial">
            <option value="con">Concellos</option>
            <option value="par">Parroquias</option>
            <option value="com">Comarcas</option>
            <option value="prov">Provincias</option>
          </select>
          <button id="mapSearchBtn" type="button">Buscar</button>
        </div>

        <div class="floating-reset">
          <button id="resetMapViewBtn" type="button" aria-label="Recentrar o mapa en toda Galiza" title="Recentrar o mapa">
            <svg class="isotipo isotipo-diana" viewBox="8 10 48 48" aria-hidden="true" focusable="false"><path d="M50.79 27.16A20 20 0 1 1 38.84 15.21"/><circle cx="32" cy="34" r="6.5"/></svg>
          </button>
        </div>

        <div id="mapLoading" class="map-loading" hidden></div>
        <div id="mapResults" class="floating-results"></div>
        <article class="map-card">
          <button id="clearTerritory" class="card-close" type="button" aria-label="Limpar territorio">×</button>
          <button id="mapCardToggle" class="map-card-toggle" type="button" aria-expanded="true">Información</button>
          <div class="map-card-sil" id="mapCardSil" data-silhouette-hero="galiza" aria-hidden="true"></div>
          <div class="eyebrow" id="mapCardLabel"></div>
          <h2 id="mapCardTitle">Galiza</h2>
          <div class="stats">
            <div class="stat"><b id="mapCoplaCount">0</b><span>coplas</span></div>
            <div class="stat"><b id="mapPieceCount">0</b><span>pezas</span></div>
            <div class="stat"><b id="mapTerritoryCount">0</b><span>territorios</span></div>
          </div>
          <div class="map-actions">
            <button class="btn primary" type="button" data-map-action="territory">Abrir territorio</button>
            <button class="btn" type="button" data-map-action="coplas">Ver coplas</button>
          </div>
        </article>
      </section>

      <section class="view" id="view-coplas" aria-label="Coplas"></section>
      <section class="view" id="view-melodies" aria-label="Melodías"></section>
      <section class="view" id="view-pieces" aria-label="Pezas"></section>
      <section class="view" id="view-territory" aria-label="Territorios"></section>
      <section class="view" id="view-submit" aria-label="Alta"></section>
      <section class="view" id="view-media" aria-label="Media"></section>
      <section class="view" id="view-about" aria-label="Sobre Fol e ar"></section>
      <div id="coplaDrawer" class="copla-drawer" hidden></div>
      <div id="pieceDrawer" class="copla-drawer" hidden></div>
      <div id="melodyDrawer" class="copla-drawer" hidden></div>
      <div id="melodyModal" hidden></div>
      <div id="pdfViewer" class="pdf-viewer" hidden></div>
      <div id="deleteConfirmModal" hidden></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Navegación móbil">
    <button class="active" type="button" data-view="map">⌖<span>Mapa</span></button>
    <button type="button" data-view="territory">⌂<span>Territorios</span></button>
    <button type="button" data-view="coplas">≋<span>Coplas</span></button>
    <div class="mobile-nav-group">
      <button type="button" id="mobileExploreBtn" data-mobile-explore aria-haspopup="true" aria-expanded="false" aria-controls="mobileExploreMenu">☰<span>Explorar ▴</span><b class="cart-count" data-cart-count hidden>0</b></button>
      <div class="mobile-menu" id="mobileExploreMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-view="pieces"><i>♪</i>Pezas<b class="cart-count" data-cart-count hidden>0</b></button>
        <button type="button" role="menuitem" data-view="media"><i>◧</i>Media</button>
        <button type="button" role="menuitem" data-view="melodies"><i>♫</i>Melodías</button>
        <button type="button" role="menuitem" data-view="about"><i><svg class="isotipo" viewBox="8 9 48 50" aria-hidden="true" focusable="false"><path d="M50.79 27.16A20 20 0 1 1 38.84 15.21"/><circle cx="51.1" cy="14.9" r="4.2"/></svg></i>Sobre o arquivo</button>
      </div>
    </div>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <script type="module">
    if (!window.FOL_E_AR_FILE_MODE) import("./js/archive_app.js");
  </script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
